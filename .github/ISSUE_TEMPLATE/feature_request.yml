name: 💡 新功能建议
description: 提出 NCL 目前尚未拥有的全新功能
title: "[新功能/Feature] "
labels: ["新功能"]
body:
  - type: markdown
    attributes:
      value: |
       ### 🛑 提交前必读 (Pre-submission Checklist)

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 我已在 Issues 页面中搜索，确认该功能未被其他用户提交过。
          required: true
        - label: 我理解 NCL 处于极早期开发阶段，提出新功能不保证一定会被实现。
          required: true
        - label: 我确认这项功能能够体现 NCL 的“差异化优势”（PCL/HMCL 未实现，或 NCL 能做得更好）。
          required: true
        - label: 我确认这不是现有功能的调整，而是一个全新的模块或机制。
          required: true

  - type: textarea
    id: feature-desc
    attributes:
      label: 💡 功能描述 (Description)
      description: 请清晰、详细地描述你想要的功能是什么。
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 使用场景与痛点 (Use Case & Pain Point)
      description: 这个功能能解决什么问题？如果没有这个功能，你现在的体验有多糟？
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 🎨 期望的交互与样式 (Expected Behavior)
      description: 如果你有 UI 界面的想法请附图；如果是底层架构，请描述预期效果。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 替代方案 (Alternatives)
      description: 你现在是用什么办法解决这个需求的？
    validations:
      required: false