name: Auto Close Issues by Label

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    # 只有当 Issue 是打开状态时才执行，防止重复关闭报错
    if: github.event.issue.state == 'open'
    steps:
      - name: Auto Close and Comment
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const issue = context.issue;
            
            // 定义你的“不计划”标签组 (Closed as not planned)
            const notPlannedLabels = [
              '❌ 重复', '❌ 拒绝/放弃', '❌ 网络问题', '❌ 无有效信息', 
              '❌ 无法复现', '❌ 第三方', '🚫 忽略', '💵 成本过高'
            ];
            
            // 定义你的“完成”标签组 (Closed as completed)
            const completedLabels = ['👌 完成'];

            let state_reason = null;
            let commentBody = '';

            // 1. 判断是否属于“不计划”的标签
            if (notPlannedLabels.includes(label)) {
              state_reason = 'not_planned';
              commentBody = `### 🚫 Issue 已自动关闭 (Not Planned)\n\n> **关闭原因：** 标记为 \`${label}\`。\n\nNCL 团队致力于保持高效的 Issue 追踪。如果您认为这是一个误判，或者后续找到了新的线索/日志，欢迎随时补充信息并重新打开此 Issue。`;
            } 
            // 2. 判断是否属于“已完成”的标签
            else if (completedLabels.includes(label)) {
              state_reason = 'completed';
              commentBody = `### ✅ Issue 已完成 (Completed)\n\n> 开发团队已完成该内容。\n\n感谢您的反馈与支持，相关改动将在 NCL 的下一个发布版本中与您相见！`;
            } 
            // 3. 如果是其他标签（比如打上了“💬 需要复现”），则不做任何操作直接退出
            else {
              return;
            }

            // 4. 发送定制化留言
            await github.rest.issues.createComment({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              body: commentBody
            });

            // 5. 更新状态并关闭
            await github.rest.issues.update({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: state_reason // 核心：这里会自动区分 not_planned 还是 completed
            });