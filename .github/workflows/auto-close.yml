name: Auto Close Issues by Label

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # 只有 Issue 处于打开状态才执行，防止多标签同时添加导致重复触发
    if: github.event.issue.state == 'open'
    steps:
      - name: Auto Close and Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            // 获取当前 Issue 上所有的标签
            const currentLabels = context.payload.issue.labels.map(l => l.name);

            // 1. 定义关闭类标签及其对应的解释字典 (必须和 JSON 里的 description 一字不差)
            const notPlannedDict = {
              '❌ 重复': '已有详细内容在其他 Issue 提及。',
              '❌ 拒绝/放弃': '因技术难题、架构冲突或超出边界不予处理。',
              '❌ 网络问题': '由用户本地网络环境导致。',
              '❌ 无有效信息': '用户无法提供日志/截图/复现步骤。',
              '❌ 无法复现': '开发者无法复现该问题。',
              '❌ 第三方': '由第三方 API、底层库或系统导致。',
              '🚫 忽略': '不符合发展方向、偏门或无效建议。',
              '💵 成本过高': '当前维护者精力或项目资源无法支撑。'
            };
            const completedDict = {
              '👌 完成': '开发者已完成该内容，将在下一个版本合并。'
            };

            // 2. 找出当前 Issue 中触发的关闭标签
            let matchedNotPlanned = [];
            let matchedCompleted = [];

            currentLabels.forEach(l => {
              if (notPlannedDict[l]) matchedNotPlanned.push(l);
              if (completedDict[l]) matchedCompleted.push(l);
            });

            // 如果没有任何关闭类标签，直接结束（说明只是打了“信息补充”等普通标签）
            if (matchedNotPlanned.length === 0 && matchedCompleted.length === 0) return;

            // 3. 生成关闭原因 Markdown (支持多标签合并)
            let reasonText = '';
            let state_reason = '';

            if (matchedNotPlanned.length > 0) {
              state_reason = 'not_planned';
              reasonText = matchedNotPlanned.map(l => `- **${l}**：${notPlannedDict[l]}`).join('\n');
            } else {
              state_reason = 'completed';
              reasonText = matchedCompleted.map(l => `- **${l}**：${completedDict[l]}`).join('\n');
            }

            // 4. 自动清理“等待/处理中”类标签（如果存在）
            const pendingLabels = [
              '⏳ 等待', '⏳ 等待前置', '⏳ 等待合并', '⏳ 暂停', '⏳ 等待处理',
              '💬 信息补充', '💬 需要复现', '💬 需要外部帮助'
            ];
            for (const lbl of pendingLabels) {
              if (currentLabels.includes(lbl)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: issue.owner, repo: issue.repo, issue_number: issue.number, name: lbl
                  });
                } catch (error) {
                  console.log(`移除标签 ${lbl} 失败（可能已被移除）`);
                }
              }
            }

            // 5. 发送最终评论
            const commentBody = `### ${state_reason === 'completed' ? '✅' : '🚫'} Issue 已自动关闭 (${state_reason})\n\n**关闭原因：**\n${reasonText}\n\n> NCL 团队致力于保持高效的 Issue 追踪。如果您认为这是一个误判，或者后续找到了新的线索/日志，欢迎随时补充信息并重新打开此 Issue。`;

            await github.rest.issues.createComment({
              owner: issue.owner, repo: issue.repo, issue_number: issue.number, body: commentBody
            });

            // 6. 执行关闭
            await github.rest.issues.update({
              owner: issue.owner, repo: issue.repo, issue_number: issue.number, state: 'closed', state_reason: state_reason
            });